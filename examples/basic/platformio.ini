; StatusLed basic example. The library is pulled from ../.. so edits build immediately.
[env]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312/platform-espressif32.zip
framework = arduino
monitor_speed = 115200
lib_deps =
    symlink://../..
    adafruit/Adafruit NeoPixel
build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=1
    ; -DLOG_LED   ; log every LED write with a timestamp

[env:m5stack-nanoc6]
board = esp32-c6-devkitm-1
board_build.mcu = esp32c6
board_build.partitions = ota_nofs_4MB.csv
build_flags =
    ${env.build_flags}
    -DARDUINO_USB_MODE=1
    -DRGB_LED_PIN=20
    -DRGB_POWER_PIN=19

[env:m5stamp-s3]
board = m5stack-stamps3
build_flags =
    ${env.build_flags}
    -DRGB_LED_PIN=21
